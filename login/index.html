<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - LITERA</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Background Layer Estetik Perpustakaan/Buku -->
    <div class="bg-overlay"></div>

    <div class="auth-container">
        <!-- Kartu Glassmorphism Utama -->
        <div class="glass-card">
            
            <!-- Logo & Heading -->
            <div class="auth-header">
                <div class="brand-logo-img">
                    <img src="../foto/logo.jpeg" alt="Logo Litera">
                </div>
                <h1>Selamat Datang Kembali</h1>
                <p>Masuk untuk melanjutkan perjalanan literasi Anda di Litera</p>
            </div>

            <!-- Form Login (onsubmit inline telah dihapus) -->
            <form class="auth-form" id="form-login">
                
                <div class="input-group">
                    <span class="input-icon"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="login-email" placeholder="Email Akademik / Pribadi" required>
                </div>

                <div class="input-group">
                    <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="login-password" placeholder="Kata Sandi" required>
                    <span class="password-toggle"><i class="fa-solid fa-eye-slash"></i></span>
                </div>

                <div class="options-group">
                    <label class="checkbox-label">
                        <input type="checkbox">
                        <span>Ingat saya</span>
                    </label>
                    <a href="#" class="forgot-link">Lupa sandi?</a>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Masuk ke Akun</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="divider">
                <span>ATAU</span>
            </div>

            <!-- Social Login Buttons -->
            <div class="social-login">
                <button type="button" class="btn-social">
                    <i class="fa-brands fa-google" style="color: #ea4335;"></i>
                    <span>Google</span>
                </button>
                <button type="button" class="btn-social">
                    <i class="fa-brands fa-apple" style="color: #111111;"></i>
                    <span>Apple</span>
                </button>
            </div>

            <!-- Footer Link -->
            <div class="auth-footer">
                <span>Belum punya akun? <a href="../Regist/index.html">Daftar sekarang</a></span>
            </div>

        </div>
    </div>

<script>
  // LANGKAH 3: LOGIKA LOGIN SCRIPT SESUAI ROLE (ADMIN / USER)
  const loginForm = document.getElementById('form-login');
  if (loginForm) {
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const response = await fetch('http://localhost:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (result.success) {
          // Simpan data user di localStorage browser
          localStorage.setItem('user', JSON.stringify(result.user));
          alert(`Selamat datang, ${result.user.nama}!`);

          // PERUTEAN/REDIRECT BERDASARKAN ROLE
          if (result.user.role === 'admin') {
            window.location.href = '../Dashboard Admin/index.html';
          } else {
            window.location.href = '../Dashboard Pengguna/index.html';
          }
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert('Gagal terhubung ke server backend! Pastikan node server.js sudah berjalan.');
      }
    });
  }
</script>

</body>
</html>
